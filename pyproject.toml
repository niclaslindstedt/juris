[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "juris"
version = "0.1.0"
description = "Swedish legal data collection tool"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2",
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "click>=8",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
juris = "juris.cli:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
