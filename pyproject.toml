[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "juris"
version = "0.1.0"
description = "Swedish legal data collection tool"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing",
]

dependencies = [
    "httpx>=0.27",
    "pydantic>=2",
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "click>=8",
    "pyyaml>=6",
    "pymupdf>=1.24",
]

[project.urls]
Homepage = "https://github.com/niclaslindstedt/juris"
Repository = "https://github.com/niclaslindstedt/juris"
Issues = "https://github.com/niclaslindstedt/juris/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
juris = "juris.cli:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
markers = [
    "e2e: end-to-end tests that hit real APIs (may be slow)",
]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
