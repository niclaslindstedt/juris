        <header>
          <h1>juris — A git-native open database for Swedish law</h1>
          <p>
            <strong>juris</strong> is an open-source Python CLI that collects
            and normalizes Swedish and EU legal documents into a unified,
            version-controllable database of JSON + Markdown files. It is
            designed for legal researchers, journalists, civic-tech
            developers, and AI/LLM pipelines that need a clean, reproducible
            corpus of Swedish and European law.
          </p>
          <p>
            <a href="https://github.com/niclaslindstedt/juris">GitHub repository</a>
            &middot;
            <a href="https://pypi.org/project/juris/">PyPI package</a>
            &middot;
            <a href="/docs">Documentation</a>
            &middot;
            <a href="/manual">CLI manual</a>
            &middot;
            <a href="/llms.txt">llms.txt</a>
          </p>
        </header>

        <section>
          <h2>Quick start</h2>
          <pre>pip install juris
juris collect-all
juris status</pre>
          <p>
            Documents are written to
            <code>data/{doc_type}/{session}/{id}.{json,md}</code>. JSON for
            machines, Markdown with YAML frontmatter for humans and LLMs.
          </p>
        </section>

        <section>
          <h2>Why juris?</h2>
          <ul>
            <li><strong>One CLI, every Swedish source.</strong> Riksdagen, Regeringen, Domstolsverket, JO, JK, Lagrummet, EUR-Lex, CJEU (Curia), and HUDOC (ECHR) — all behind one async, rate-limited Python tool.</li>
            <li><strong>Git-native storage.</strong> Plain JSON + Markdown means you can <code>git diff</code> changes to law over time and review them in a pull request.</li>
            <li><strong>Incremental.</strong> State tracking under <code>.state/</code> resumes where you left off, skipping already-collected documents.</li>
            <li><strong>PDF text extraction.</strong> Attachments are downloaded and full-text extracted via pymupdf, with graceful fallback.</li>
            <li><strong>Agent-friendly.</strong> Ships <code>--help-agent</code>, <code>--debug-agent</code>, a <code>commands</code> index, and full man pages so AI coding agents can use juris without prior knowledge.</li>
          </ul>
        </section>

        <section>
          <h2>Document types (21)</h2>
          <p>
            Bills (<code>prop</code>), motions (<code>mot</code>),
            committee reports (<code>bet</code>), parliamentary writs
            (<code>skr</code>), official inquiries (<code>SOU</code>),
            ministry memoranda (<code>Ds</code>), committee directives
            (<code>dir</code>), council-of-legislation referrals
            (<code>lagr</code>), statutes (<code>SFS</code>),
            Supreme Court rulings (<code>NJA</code>), Labour Court
            (<code>AD</code>), Supreme Administrative Court
            (<code>HFD</code>), land &amp; environment courts
            (<code>mod</code>, <code>pmod</code>), Parliamentary Ombudsman
            decisions (<code>JO</code>), Chancellor of Justice decisions
            (<code>JK</code>), agency regulations (<code>foreskrift</code>,
            <code>AFS</code>, <code>HSLF-FS</code>), EU regulations
            (<code>eu_reg</code>), EU directives (<code>eu_dir</code>),
            CJEU rulings (<code>cjeu</code>), and ECHR rulings
            (<code>echr</code>).
          </p>
        </section>

        <section>
          <h2>Data sources (8)</h2>
          <ul>
            <li><strong>Riksdagen</strong> — Swedish Parliament open data (JSON API, <code>data.riksdagen.se</code>)</li>
            <li><strong>Regeringen</strong> — Swedish Government publications (web scraping, <code>regeringen.se</code>)</li>
            <li><strong>Domstolsverket</strong> — Swedish courts (REST API, <code>domstol.se</code>)</li>
            <li><strong>JO &amp; JK</strong> — Parliamentary Ombudsman + Chancellor of Justice (<code>jo.se</code> / <code>jk.se</code>)</li>
            <li><strong>Lagrummet</strong> — agency regulations and guidelines (<code>lagrummet.se</code>)</li>
            <li><strong>EUR-Lex</strong> — EU regulations and directives (SPARQL, <code>eur-lex.europa.eu</code>)</li>
            <li><strong>Curia</strong> — Court of Justice of the EU (SPARQL, <code>curia.europa.eu</code>)</li>
            <li><strong>HUDOC</strong> — European Court of Human Rights (JSON API, <code>hudoc.echr.coe.int</code>)</li>
          </ul>
        </section>

          <ul>
            <li><a href="/manual/juris"><code>juris</code></a> — top-level entry point</li>

        <section>
          <h2>Tech stack</h2>
          <p>
            Python 3.11+, async/await, <code>httpx</code> (HTTP),
            <code>pydantic</code> (validation), <code>beautifulsoup4</code> +
            <code>lxml</code> (HTML/XML), <code>click</code> (CLI),
            <code>pymupdf</code> (PDF text extraction), and
            <code>pyyaml</code> (Markdown frontmatter). Strict
            <code>mypy</code>, <code>ruff</code> linting, pytest with
            <code>asyncio_mode = auto</code>.
          </p>
        </section>
