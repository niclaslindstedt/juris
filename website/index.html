        <header>
          <h1>juris — A git-native open database for Swedish law</h1>
          <p>
            <strong>juris</strong> is an open-source Python CLI that collects
            and normalizes Swedish and EU legal documents into a unified,
            version-controllable database of JSON + Markdown files.
          </p>
        </header>
        <section>
          <h2>What juris collects</h2>
          <p>
            21 document types across 8 official sources: Riksdagen
            (propositioner, motioner, betänkanden, skrivelser), Regeringen
            (SOU, Ds, kommittédirektiv, lagrådsremisser), Domstolsverket (NJA,
            AD, HFD, mark- och miljödomstolen), JO and JK (ombudsmannabeslut),
            Lagrummet (myndighetsföreskrifter, AFS, HSLF-FS), EUR-Lex (EU
            regulations and directives), CJEU (Court of Justice of the EU
            rulings), and HUDOC (European Court of Human Rights rulings).
          </p>
        </section>
        <section>
          <h2>Install</h2>
          <pre>pip install juris</pre>
