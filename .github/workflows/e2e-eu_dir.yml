name: eu_dir

on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -m e2e "tests/test_e2e.py::TestEurLexE2E::test_collect_each_type[eu_dir]" "tests/test_e2e.py::TestEurLexE2E::test_update_index[eu_dir]" -v --timeout=120
